name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci): quality (swift-format,
# the analyzers against .ci/baselines, the GCD ban), the tests on Linux and macOS, the self-analysis with this build,
# the heavy checks nightly, and for a `v*` tag the archives and the release from release-notes/<tag>.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@5cf1132eee5e96c7ad195f81bac005368c7fc463 # swift-ci 5cf1132
    permissions:
      contents: write # only used to publish a tag
    secrets: inherit
