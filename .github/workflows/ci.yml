name: CI

# The graph (lint, linux and macOS in parallel, release archives on main and tags, one required gate) lives in
# the shared workflow; this file only says what is specific to deadwood. A `v*` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@a20fb18feff6a9ff54ebee5bb70f4bee126c9e8e # aemi a20fb18
    permissions:
      contents: write
    with:
      tool: deadwood
      linux-extra: Scripts/run-removal-oracle.sh
      macos-timeout: 45
