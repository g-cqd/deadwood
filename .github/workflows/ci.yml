name: CI

# The graph (lint, linux and macOS in parallel, release archives on main and tags, one required gate) lives in
# the shared workflow; this file only says what is specific to deadwood. A `v*` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@f6da05cd0efdf60700e854efb5b6092eae89b8c5 # aemi f6da05c
    permissions:
      contents: write
    with:
      tool: deadwood
      linux-extra: Scripts/run-removal-oracle.sh
      macos-timeout: 45
