name: Release

# Tag vX.Y.Z (matching ToolInfo.version) → build versioned binaries for both
# platforms, checksum them, and attach everything to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-6.4.x-jammy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build, verify version, package
        # Dynamic link + bundled Swift runtime .so files: the binary carries
        # an $ORIGIN rpath, so the archive is self-contained on any
        # glibc-compatible distro (the nightly static-stdlib SDK cannot link).
        run: |
          swift build -c release
          BIN="$(swift build -c release --show-bin-path)/deadwood"
          VERSION="$("$BIN" --version)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_NAME}" != "${GITHUB_REF}" ] && [ -n "$TAG" ] && [ "$VERSION" != "$TAG" ]; then
            echo "tag v$TAG does not match ToolInfo.version $VERSION" >&2
            exit 1
          fi
          NAME="deadwood-$VERSION-linux-x86_64"
          mkdir "$NAME"
          cp "$BIN" LICENSE README.md "$NAME/"
          # Ship a stripped binary: SwiftPM leaves ~32 MiB of .debug_* sections
          # in the release build (measured on v0.7.0: 52.5 MiB -> 11.7 MiB).
          strip "$NAME/deadwood"
          ldd "$BIN" | awk '$3 ~ /\/usr\/lib\/swift/ {print $3}' | sort -u \
            | xargs -r -I{} cp {} "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            deadwood-*.tar.gz
            deadwood-*.sha256

  macos:
    runs-on: macos-26
    # continue-on-error so a macOS post-run stall can never block the Linux
    # binary: publish treats this job as satisfied and ships whatever built.
    continue-on-error: true
    # Same stall countermeasures as CI: pipe isolation, step bounds, job bound.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Swift 6.4 (vendored dated snapshot)
        timeout-minutes: 10
        uses: ./.github/actions/setup-swift
      - name: Build, verify version, package
        timeout-minutes: 15
        run: |
          set +e
          swift build -c release > build.log 2>&1 < /dev/null
          status=$?
          cat build.log
          [ $status -ne 0 ] && exit $status
          BIN="$(swift build -c release --show-bin-path)/deadwood"
          VERSION="$("$BIN" --version)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_NAME}" != "${GITHUB_REF}" ] && [ -n "$TAG" ] && [ "$VERSION" != "$TAG" ]; then
            echo "tag v$TAG does not match ToolInfo.version $VERSION" >&2
            exit 1
          fi
          NAME="deadwood-$VERSION-macos-arm64"
          mkdir "$NAME"
          cp "$BIN" LICENSE README.md "$NAME/"
          # Same on macOS, where release builds keep their debug map
          # (measured on v0.7.0: 26 MiB -> 14 MiB). -S drops debug symbols,
          # -x drops non-global ones; both keep the binary runnable.
          strip -S -x "$NAME/deadwood"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            deadwood-*.tar.gz
            deadwood-*.sha256
      - name: Reap toolchain stragglers
        if: always()
        run: |
          pgrep -fl 'swift-frontend|swift-driver|swift-build|leaks' || true
          for pattern in swift-frontend swift-driver swift-build swift-package SourceKitService sourcekit-lsp; do
            pkill -9 -f "$pattern" 2>/dev/null || true
          done
          exit 0

  publish:
    # macOS is continue-on-error, so `needs` treats it as satisfied even if it
    # stalled or failed — publish then ships whatever artifacts exist (Linux
    # always; macOS when it built). A single-platform stall never blocks a
    # release.
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Assemble the SwiftPM artifact bundle
        # A .artifactbundle.zip is what `.binaryTarget(url:checksum:)` consumes,
        # so an Xcode project or a package can depend on a pinned deadwood the
        # same way it already depends on SwiftLint or swift-format — no source
        # build, no Swift 6.4 toolchain on the consumer's runner. Built here
        # rather than per-platform because one bundle carries every variant.
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=""
          BUNDLE="deadwood.artifactbundle"
          mkdir -p "$BUNDLE"
          variants=""
          for archive in deadwood-*-macos-arm64.tar.gz deadwood-*-linux-x86_64.tar.gz; do
            tar -xzf "$archive"
            name="${archive%.tar.gz}"
            case "$name" in
              *-macos-arm64) triple="arm64-apple-macosx" ;;
              *-linux-x86_64) triple="x86_64-unknown-linux-gnu" ;;
              *) continue ;;
            esac
            VERSION="${name#deadwood-}"; VERSION="${VERSION%-macos-arm64}"; VERSION="${VERSION%-linux-x86_64}"
            mkdir -p "$BUNDLE/$name/bin"
            # Linux archives carry the Swift runtime .so files beside the
            # binary; they must travel with it.
            cp "$name"/deadwood "$BUNDLE/$name/bin/"
            for so in "$name"/*.so*; do cp "$so" "$BUNDLE/$name/bin/"; done
            variants="$variants{\"path\":\"$name/bin/deadwood\",\"supportedTriples\":[\"$triple\"]},"
          done
          if [ -z "$variants" ]; then
            echo "::warning::no platform archives to bundle"
            exit 0
          fi
          printf '{"schemaVersion":"1.0","artifacts":{"deadwood":{"type":"executable","version":"%s","variants":[%s]}}}\n' \
            "$VERSION" "${variants%,}" > "$BUNDLE/info.json"
          zip -qr "deadwood-$VERSION.artifactbundle.zip" "$BUNDLE"
          # SwiftPM checksums the zip with `swift package compute-checksum`,
          # which is a plain SHA-256 of the file.
          sha256sum "deadwood-$VERSION.artifactbundle.zip" > "deadwood-$VERSION.artifactbundle.zip.sha256"

      - name: Create or update release with whatever binaries built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(deadwood-*.tar.gz deadwood-*.artifactbundle.zip deadwood-*.sha256)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no release artifacts built on any platform"
            exit 1
          fi
          if ! ls deadwood-*-macos-arm64.tar.gz >/dev/null 2>&1; then
            echo "::warning::no macOS artifact — publishing Linux only (macOS lane failed/stalled)"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --generate-notes "${assets[@]}"
          fi
